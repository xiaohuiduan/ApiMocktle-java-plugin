<h1>ApiMocktle</h1>
<br/>
<b>从源码提取 API 并同步到 YAPI</b>
<br/>
<ul>
    <li>从 Javadoc、KDoc 和 ScalaDoc 解析 API 文档</li>
    <li>支持 Spring MVC、Feign、JAX-RS（Quarkus、Jersey）</li>
    <li>支持 javax.validation、Jackson、Gson、Swagger 注解</li>
    <li>灵活的配置规则，最小化代码侵入</li>
</ul>
<br/>
<b>使用方法：</b>
<ol>
    <li>在编辑器或项目视图中右键点击 Controller 文件、类或方法</li>
    <li>从上下文菜单中选择 <b>导出API</b></li>
    <li>API 将自动同步到 YAPI</li>
</ol>
